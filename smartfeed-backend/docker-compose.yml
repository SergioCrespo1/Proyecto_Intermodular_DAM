services:
  smartfeed-mysql:
    image: mysql:8.0
    container_name: smartfeed_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: smartfeed_db
      MYSQL_USER: smartfeed_user
      MYSQL_PASSWORD: smartfeed_pass
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      # Persistencia de los datos en disco
      - mysql_smartfeed_data:/var/lib/mysql
      # Carga automática del esquema DDL al inicializar por primera vez
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  mysql_smartfeed_data: